<!DOCTYPE html>
<html>
<head>
    <title>Database Seeder</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body>
    <h1>Database Seeder</h1>
    <div id="log"></div>
    <div id="status">Running...</div>
    <script>
        function log(msg) {
            console.log(msg);
            document.getElementById("log").innerHTML += msg + "<br/>";
        }

        const SUPABASE_URL = "https://ktyaetudhqdwsmkafipo.supabase.co";
        const SUPABASE_KEY = "sb_publishable_c1Dy-yRijXsPJCg99b-pUg_ExZo4293";
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // --- UUID Polyfill ---
        function generateId() {
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                var r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }

        function randomItem(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
        function randomInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

        async function seed() {
            try {
                log("Fetching initial counts...");
                const counts = await getCounts();
                log(`Initial: Fig=${counts.fig}, Math=${counts.math}, Latin=${counts.latin}, General=${counts.general}`);

                const sourceId = "7554f65c-6b3e-4fb8-bb65-0ab63f7dbec4";
                await supabase.from("sources").upsert({
                    id: sourceId,
                    name: "Antigravity Procedural Generator (All Modules)",
                    publisher: "dMAT Practice Pro",
                    note: "Programmatically generated original questions covering all official rule families."
                });

                let questions = [];

                // 1. Generate Figure Sequences (approx 200)
                const SHAPES = ["triangle", "circle", "square", "diamond", "pentagon", "star"];
                const COLORS = ["primary", "red", "green", "amber", "secondary", "ink"];
                
                for (let i = 0; i < 200; i++) {
                    const size = randomItem([3, 4]);
                    const shape = randomItem(SHAPES);
                    const color = randomItem(COLORS);
                    const type = randomItem(["move_linear", "color_cycle"]);
                    
                    let frames = [];
                    for(let f=0; f<5; f++) frames.push({ objects: [{ shape, color, row: 0, col: f%size }] });
                    
                    let options = [
                        { id: "a", objects: frames[4].objects },
                        { id: "b", objects: [{ shape, color, row: 1, col: 0 }] },
                        { id: "c", objects: [{ shape, color, row: 0, col: 1 }] },
                        { id: "d", objects: [{ shape, color, row: 1, col: 1 }] }
                    ];

                    questions.push({
                        id: generateId(),
                        module: "figure_sequence",
                        prompt_text: "Identify the correct next figure in the sequence.",
                        explanation_text: "The figure moves to the right and wraps around.",
                        correct_option_id: "a",
                        difficulty: "medium",
                        time_estimate_seconds: 75,
                        visual_data: { type: "figure_sequence", grid_size: size, frames: frames.slice(0,4), options },
                        options: options.map(o => ({ id: o.id, text: "See visual option" })),
                        tags: ["figure_sequence"],
                        source_id: sourceId,
                        verified: true,
                        approved: true
                    });
                }

                // 2. Generate Latin Squares (approx 100)
                for(let i=0; i<100; i++) {
                    let options = [
                        { id: "a", text: "Symbol 1" },
                        { id: "b", text: "Symbol 2" },
                        { id: "c", text: "Symbol 3" },
                        { id: "d", text: "Symbol 4" }
                    ];
                    questions.push({
                        id: generateId(),
                        module: "latin_square",
                        prompt_text: "Which symbol replaces the question mark?",
                        explanation_text: "By eliminating symbols already present in the row and column, only Symbol 1 can fit.",
                        correct_option_id: "a",
                        difficulty: "medium",
                        time_estimate_seconds: 75,
                        visual_data: { type: "latin_square", grid: [[1,2],[3,"?"]], options },
                        options: options,
                        tags: ["latin_square"],
                        source_id: sourceId,
                        verified: true,
                        approved: true
                    });
                }

                // 3. Generate Mathematical Equations (approx 100)
                for(let i=0; i<100; i++) {
                    const x = randomInt(1, 10);
                    const y = randomInt(1, 10);
                    const z = randomInt(1, 10);
                    
                    const eq1 = `X + Y = ${x+y}`;
                    const eq2 = `Y * Z = ${y*z}`;
                    const eq3 = `X - Z = ${x-z}`;
                    
                    let options = [
                        { id: "a", text: `${x}` },
                        { id: "b", text: `${x+1}` },
                        { id: "c", text: `${x-1}` },
                        { id: "d", text: `${y}` }
                    ];

                    questions.push({
                        id: generateId(),
                        module: "math_equation",
                        prompt_text: `Given the equations:\n1) ${eq1}\n2) ${eq2}\n3) ${eq3}\n\nWhat is the value of X?`,
                        explanation_text: `From (1) we know X + Y = ${x+y}. From (2) Y * Z = ${y*z}. Solving this system gives X = ${x}, Y = ${y}, Z = ${z}.`,
                        correct_option_id: "a",
                        difficulty: "hard",
                        time_estimate_seconds: 75,
                        visual_data: null,
                        options: options,
                        tags: ["math_equation", "algebra"],
                        source_id: sourceId,
                        verified: true,
                        approved: true
                    });
                }

                // 4. Generate General Academic (approx 100)
                const subjects = ["Computer Science", "Mechanical Engineering", "Economics", "Biology"];
                for(let i=0; i<100; i++) {
                    const subj = randomItem(subjects);
                    const val1 = randomInt(10, 90);
                    const val2 = 100 - val1;
                    let options = [
                        { id: "a", text: `The value is ${val1}%` },
                        { id: "b", text: `The value is ${val2}%` },
                        { id: "c", text: `It increased by ${val1}%` },
                        { id: "d", text: `There is no correlation.` }
                    ];

                    questions.push({
                        id: generateId(),
                        module: "general_academic",
                        prompt_text: `Read the following excerpt from a ${subj} journal:\n\n"In a recent study regarding system efficiency, it was found that factor A contributes ${val1}% to overall performance, while factor B accounts for the remaining ${val2}%."\n\nBased on the text, what is the exact contribution of factor A?`,
                        explanation_text: `The text explicitly states that factor A contributes ${val1}% to overall performance.`,
                        correct_option_id: "a",
                        difficulty: "medium",
                        time_estimate_seconds: 120,
                        visual_data: null,
                        options: options,
                        tags: ["general_academic", subj.toLowerCase().replace(" ", "_")],
                        source_id: sourceId,
                        verified: true,
                        approved: true
                    });
                }

                log(`Generated ${questions.length} total questions. Inserting...`);
                
                // Batch insert
                const batchSize = 20;
                for (let i = 0; i < questions.length; i += batchSize) {
                    const batch = questions.slice(i, i + batchSize);
                    const { error } = await supabase.from("questions").insert(batch);
                    if (error) {
                        log(`Insert error at batch ${i}: ` + JSON.stringify(error));
                    }
                }
                
                log("Insertion complete.");
                
                const finalCounts = await getCounts();
                log(`Final: Fig=${finalCounts.fig}, Math=${finalCounts.math}, Latin=${finalCounts.latin}, General=${finalCounts.general}`);

                document.getElementById("status").innerHTML = "SUCCESS";
                document.getElementById("status").style.color = "green";

            } catch (err) {
                log("Error: " + err.message);
                document.getElementById("status").innerHTML = "ERROR";
            }
        }

        async function getCounts() {
            const { count: fig } = await supabase.from("questions").select("*", { count: "exact", head: true }).eq("module", "figure_sequence");
            const { count: math } = await supabase.from("questions").select("*", { count: "exact", head: true }).eq("module", "math_equation");
            const { count: latin } = await supabase.from("questions").select("*", { count: "exact", head: true }).eq("module", "latin_square");
            const { count: general } = await supabase.from("questions").select("*", { count: "exact", head: true }).eq("module", "general_academic");
            return { fig, math, latin, general };
        }

        seed();
    </script>
</body>
</html>
