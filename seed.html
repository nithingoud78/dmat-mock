<!DOCTYPE html>
<html>
<head>
    <title>Database Seeder</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body>
    <h1>Database Seeder</h1>
    <div id="log"></div>
    <div id="status">Running...</div>
    <script>
        function log(msg) {
            console.log(msg);
            document.getElementById("log").innerHTML += msg + "<br/>";
        }

        const SUPABASE_URL = "https://ktyaetudhqdwsmkafipo.supabase.co";
        const SUPABASE_KEY = "sb_publishable_c1Dy-yRijXsPJCg99b-pUg_ExZo4293";
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // --- UUID Polyfill ---
        function generateId() {
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                var r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }

        function randomItem(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
        function randomInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

        async function seed() {
            try {
                log("Fetching initial counts...");
                const counts = await getCounts();
                log(`Initial: Fig=${counts.fig}, Math=${counts.math}, Latin=${counts.latin}, General=${counts.general}`);

                log("Procedural generation disabled. Please run the audit script instead.");
                
                document.getElementById("status").innerHTML = "PROCEDURAL GENERATOR DISABLED";
                document.getElementById("status").style.color = "gray";

            } catch (err) {
                log("Error: " + err.message);
                document.getElementById("status").innerHTML = "ERROR";
            }
        }

        async function getCounts() {
            const { count: fig } = await supabase.from("questions").select("*", { count: "exact", head: true }).eq("module", "figure_sequence");
            const { count: math } = await supabase.from("questions").select("*", { count: "exact", head: true }).eq("module", "math_equation");
            const { count: latin } = await supabase.from("questions").select("*", { count: "exact", head: true }).eq("module", "latin_square");
            const { count: general } = await supabase.from("questions").select("*", { count: "exact", head: true }).eq("module", "general_academic");
            return { fig, math, latin, general };
        }

        seed();
    </script>
</body>
</html>
